name: Convertir lista
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python convertir.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add lista.json
          git diff --cached --quiet || (git commit -m "Actualizar lista" && git push)
