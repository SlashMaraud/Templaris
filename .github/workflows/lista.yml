name: Convertir lista
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: convertir-lista
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python convertir.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add lista.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar lista"
            git pull --rebase -X theirs origin main
            git push
          fi
